[package]
name = "craftml-studio"
version = "0.3.3"
description = "CraftML Studio - Desktop Application"
authors = ["you"]
edition = "2021"

[[bin]]
name = "craftml-studio"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "craftml_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
tar = "0.4"
flate2 = "1"


# macOS: set the Dock icon at startup. A development build is a bare executable, not an .app bundle, so
# macOS would otherwise show a generic icon for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSThread"] }
