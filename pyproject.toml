[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craftml-studio"
version = "0.1.0"
description = "Local AI engine: chat, RAG, LoRA/QLoRA fine-tuning, compression and deployment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "CraftML Studio Team"}
]
keywords = ["ai", "ml", "llm", "lora", "qlora", "rag", "quantization", "local-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "torch>=2.4,<3",
    "transformers>=5.0,<6",
    "peft>=0.17,<1",
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.45,<1",
    "datasets>=4.0,<6",
    "huggingface-hub>=0.26,<3",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "sentence-transformers>=6.0,<7",
    "gguf>=0.10,<1",
    "sqlite-vec>=0.1.6,<0.2",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "numpy>=1.26,<3",
    "psutil>=5.9,<8",
    "nvidia-ml-py>=12.535",
    "cryptography>=42,<51",
    "pydantic>=2.7,<3",
    "keyring>=25,<26",
    "httpx>=0.27,<1",
    "paramiko>=3.4,<6",
    "runpod>=1.7,<2",
    "modal>=1.0,<2",
]

[project.optional-dependencies]
gguf = [
    "llama-cpp-python>=0.3,<1",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pyflakes>=3,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "apps*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/backend"]   # core/ and the backend packages (services/, api/, db/)
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

