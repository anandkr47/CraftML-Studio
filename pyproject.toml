[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craftml-studio"
version = "0.1.0"
description = "Local AI engine: chat, RAG, LoRA/QLoRA fine-tuning, compression and deployment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "CraftML Studio Team"}
]
keywords = ["ai", "ml", "llm", "lora", "qlora", "rag", "quantization", "local-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "sqlalchemy",
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
    "sentence-transformers",
    "llama-cpp-python",
    "gguf",
    "sentencepiece",
    "datasets",
    "huggingface-hub",
    "sqlite-vec",
    "pypdf",
    "python-docx",
    "numpy",
    "psutil",
    "nvidia-ml-py",
    "loguru",
    "cryptography",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "apps*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

