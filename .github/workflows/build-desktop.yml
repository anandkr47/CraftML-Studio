name: Build Desktop (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Windows dependencies (Tauri bundling)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf curl wget file xz-utils
          # Optional: AppImage tooling
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            sudo mv appimagetool /usr/local/bin/
          fi

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build_desktop.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build_desktop.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: craftml-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**


