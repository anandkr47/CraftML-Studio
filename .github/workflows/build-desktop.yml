name: Build Desktop (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
      - "craftml-studio-v*.*.*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Cache Chocolatey packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib
          key: ${{ runner.os }}-choco-nsis-wix
          restore-keys: |
            ${{ runner.os }}-choco-

      - name: Install Windows dependencies (Tauri bundling)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf curl wget file xz-utils
          # Optional: AppImage tooling
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            sudo mv appimagetool /usr/local/bin/
          fi

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build_desktop.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build_desktop.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: craftml-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**

  release-please:
    if: startsWith(github.ref, 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GIT_TOKEN }}
          include-component-in-tag: false

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli

      - name: Collect files & generate signatures
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -e
          mkdir -p release_out

          shopt -s globstar nullglob
          files=(dist/**/bundle/**/*.{deb,rpm,AppImage,dmg,zip,msi,exe})

          for f in "${files[@]}"; do
            echo "Signing: $f"
            sig=$(tauri signer sign --private-key "$TAURI_PRIVATE_KEY" --password "$TAURI_KEY_PASSWORD" --file "$f" | tail -n1)
            echo -n "$sig" > "$f.sig"
          done

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          base="https://github.com/$owner/$repo/releases/download/$TAG_NAME"

          cat > release_out/updates.json <<EOF
          {
            "version": "${TAG_NAME#v}",
            "notes": "Release $TAG_NAME",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "$base/$(basename dist/**/bundle/nsis/*.exe 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/nsis/*.exe.sig 2>/dev/null || echo '')"
              },
              "darwin-x86_64": {
                "url": "$base/$(basename dist/**/bundle/dmg/*.dmg 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/dmg/*.dmg.sig 2>/dev/null || echo '')"
              },
              "darwin-aarch64": {
                "url": "$base/$(basename dist/**/bundle/dmg/*.dmg 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/dmg/*.dmg.sig 2>/dev/null || echo '')"
              },
              "linux-x86_64": {
                "url": "$base/$(basename dist/**/bundle/appimage/*.AppImage 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/appimage/*.AppImage.sig 2>/dev/null || echo '')"
              }
            }
          }
          EOF

          echo "Artifacts to release:"
          ls -R dist || true
          echo "updates.json:"
          cat release_out/updates.json

      - name: Generate release body (download links)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set +e
          shopt -s globstar nullglob
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          base="https://github.com/$owner/$repo/releases/download/$TAG_NAME"
          mkdir -p release_out

          # Robustly find first artifact of each type without failing the step if missing
          win_exe=""
          for f in dist/**/bundle/nsis/*.exe; do win_exe="$f"; break; done
          win_msi=""
          for f in dist/**/bundle/msi/*.msi; do win_msi="$f"; break; done
          mac_dmg=""
          for f in dist/**/bundle/dmg/*.dmg; do mac_dmg="$f"; break; done
          linux_appimage=""
          for f in dist/**/bundle/appimage/*.AppImage; do linux_appimage="$f"; break; done
          linux_deb=""
          for f in dist/**/bundle/deb/*.deb; do linux_deb="$f"; break; done
          linux_rpm=""
          for f in dist/**/bundle/rpm/*.rpm; do linux_rpm="$f"; break; done

          {
            echo "## Downloads"
            if [ -n "$win_exe" ]; then
              echo "- Windows (EXE): [$(basename "$win_exe")]($base/$(basename "$win_exe"))"
            fi
            if [ -n "$win_msi" ]; then
              echo "- Windows (MSI): [$(basename "$win_msi")]($base/$(basename "$win_msi"))"
            fi
            if [ -n "$mac_dmg" ]; then
              echo "- macOS (DMG): [$(basename "$mac_dmg")]($base/$(basename "$mac_dmg"))"
            fi
            if [ -n "$linux_appimage" ]; then
              echo "- Linux (AppImage): [$(basename "$linux_appimage")]($base/$(basename "$linux_appimage"))"
            fi
            if [ -n "$linux_deb" ]; then
              echo "- Linux (DEB): [$(basename "$linux_deb")]($base/$(basename "$linux_deb"))"
            fi
            if [ -n "$linux_rpm" ]; then
              echo "- Linux (RPM): [$(basename "$linux_rpm")]($base/$(basename "$linux_rpm"))"
            fi
          } > release_out/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_out/release_body.md
          files: |
            dist/**/bundle/**/*.{deb,rpm,AppImage,dmg,zip,msi,exe}
            dist/**/bundle/**/*.{deb.sig,rpm.sig,AppImage.sig,dmg.sig,zip.sig,msi.sig,exe.sig}
            release_out/updates.json
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
