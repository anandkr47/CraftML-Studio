name: Build Desktop (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GIT_TOKEN }}

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Windows dependencies (Tauri bundling)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf curl wget file xz-utils
          # Optional: AppImage tooling
          if ! command -v appimagetool >/dev/null 2>&1; then
            wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            sudo mv appimagetool /usr/local/bin/
          fi

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build_desktop.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build_desktop.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: craftml-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli

      - name: Collect files & generate signatures
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p release_out

          shopt -s globstar nullglob
          files=(dist/**/bundle/**/*.{deb,rpm,AppImage,dmg,zip,msi,exe})

          for f in "${files[@]}"; do
            echo "Signing: $f"
            sig=$(tauri signer sign --private-key "$TAURI_PRIVATE_KEY" --password "$TAURI_KEY_PASSWORD" --file "$f" | tail -n1)
            echo -n "$sig" > "$f.sig"
          done

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          base="https://github.com/$owner/$repo/releases/download/$TAG_NAME"

          cat > release_out/updates.json <<EOF
          {
            "version": "${TAG_NAME#v}",
            "notes": "Release $TAG_NAME",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "$base/$(basename dist/**/bundle/nsis/*.exe 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/nsis/*.exe.sig 2>/dev/null || echo '')"
              },
              "darwin-x86_64": {
                "url": "$base/$(basename dist/**/bundle/dmg/*.dmg 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/dmg/*.dmg.sig 2>/dev/null || echo '')"
              },
              "darwin-aarch64": {
                "url": "$base/$(basename dist/**/bundle/dmg/*.dmg 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/dmg/*.dmg.sig 2>/dev/null || echo '')"
              },
              "linux-x86_64": {
                "url": "$base/$(basename dist/**/bundle/appimage/*.AppImage 2>/dev/null || echo '')",
                "signature": "$(cat dist/**/bundle/appimage/*.AppImage.sig 2>/dev/null || echo '')"
              }
            }
          }
          EOF

          echo "Artifacts to release:"
          ls -R dist || true
          echo "updates.json:"
          cat release_out/updates.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/**/bundle/**/*.{deb,rpm,AppImage,dmg,zip,msi,exe}
            dist/**/bundle/**/*.{deb.sig,rpm.sig,AppImage.sig,dmg.sig,zip.sig,msi.sig,exe.sig}
            release_out/updates.json
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
