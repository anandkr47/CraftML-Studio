name: Build Desktop (Linux, macOS, Windows)

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
      - "craftml-studio-v*.*.*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]   # macos-latest = Apple Silicon
    runs-on: ${{ matrix.os }}
    env:
      # Tauri v2 names; the repository secrets keep their original names.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      # CPU-only PyTorch: with CUDA the Linux installers are ~3 GiB, over GitHub's 2 GiB release-asset limit.
      CRAFTML_TORCH: cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.lock.txt

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file xz-utils

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Auto-update bundles (.app.tar.gz / setup .exe / .AppImage + .sig) need the signing key.
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then bash scripts/build_desktop.sh --updater; else bash scripts/build_desktop.sh; fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { .\scripts\build_desktop.ps1 -Updater } else { .\scripts\build_desktop.ps1 }

      - name: Check installer sizes (GitHub release assets must be under 2 GiB)
        shell: bash
        run: |
          limit=2147483648
          bad=0
          while IFS= read -r -d '' f; do
            size=$(wc -c < "$f")
            echo "$(( size / 1048576 )) MB  $f"
            if [ "$size" -ge "$limit" ]; then echo "::error::$f is $(( size / 1048576 )) MB, over the 2 GiB release-asset limit"; bad=1; fi
          done < <(find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.tar.gz' \) -print0)
          exit $bad

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: craftml-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**

  release-please:
    if: startsWith(github.ref, 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GIT_TOKEN }}
          include-component-in-tag: false

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write the updater manifest (updates.json)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release_out
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME"
          platforms='{}'
          add() {  # add <platform-key> <updater artifact>; skipped when it has no signature
            local file="$1" key="$2"
            [ -f "$file.sig" ] || { echo "no signature for $file, skipping $key"; return; }
            # GitHub replaces spaces in uploaded asset names with dots
            platforms=$(jq --arg k "$key" --arg url "$base/$(basename "$file" | tr ' ' '.')" --rawfile sig "$file.sig" \
              '. + {($k): {url: $url, signature: $sig}}' <<<"$platforms")
          }
          first() { find "$1" -type f -name "$2" 2>/dev/null | sort | head -n1; }
          mac=$(first dist/craftml-macos-latest '*.app.tar.gz'); [ -n "$mac" ] && add "$mac" darwin-aarch64
          win=$(first dist/craftml-windows-latest '*-setup.exe'); [ -n "$win" ] && add "$win" windows-x86_64
          lin=$(first dist/craftml-ubuntu-latest '*.AppImage'); [ -n "$lin" ] && add "$lin" linux-x86_64
          jq -n --arg v "${TAG_NAME#v}" --arg notes "Release $TAG_NAME" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms}' \
            > release_out/updates.json
          cat release_out/updates.json

      - name: Generate release body (download links)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set +e
          shopt -s globstar nullglob
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          base="https://github.com/$owner/$repo/releases/download/$TAG_NAME"
          mkdir -p release_out

          # Robustly find first artifact of each type without failing the step if missing
          win_exe=""
          for f in dist/**/nsis/*.exe; do win_exe="$f"; break; done
          win_msi=""
          for f in dist/**/msi/*.msi; do win_msi="$f"; break; done
          mac_dmg=""
          for f in dist/**/dmg/*.dmg; do mac_dmg="$f"; break; done
          linux_appimage=""
          for f in dist/**/appimage/*.AppImage; do linux_appimage="$f"; break; done
          linux_deb=""
          for f in dist/**/deb/*.deb; do linux_deb="$f"; break; done
          linux_rpm=""
          for f in dist/**/rpm/*.rpm; do linux_rpm="$f"; break; done

          {
            echo "## Downloads"
            if [ -n "$win_exe" ]; then
              echo "- Windows (EXE): [$(basename "$win_exe")]($base/$(basename "$win_exe" | tr ' ' '.'))"
            fi
            if [ -n "$win_msi" ]; then
              echo "- Windows (MSI): [$(basename "$win_msi")]($base/$(basename "$win_msi" | tr ' ' '.'))"
            fi
            if [ -n "$mac_dmg" ]; then
              echo "- macOS (DMG): [$(basename "$mac_dmg")]($base/$(basename "$mac_dmg" | tr ' ' '.'))"
            fi
            if [ -n "$linux_appimage" ]; then
              echo "- Linux (AppImage): [$(basename "$linux_appimage")]($base/$(basename "$linux_appimage" | tr ' ' '.'))"
            fi
            if [ -n "$linux_deb" ]; then
              echo "- Linux (DEB): [$(basename "$linux_deb")]($base/$(basename "$linux_deb" | tr ' ' '.'))"
            fi
            if [ -n "$linux_rpm" ]; then
              echo "- Linux (RPM): [$(basename "$linux_rpm")]($base/$(basename "$linux_rpm" | tr ' ' '.'))"
            fi
          } > release_out/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_out/release_body.md
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.AppImage.sig
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.exe.sig
            release_out/updates.json
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
